<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulso Solidario — Bancos de sangre</title>
  <meta name="description"
    content="Ubica los bancos de sangre afiliados a Pulso Solidario." />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="../../assets/css/custom.css" />
  <script type="module">
    await import(`/js/auth-guard.js?t=${Date.now()}`);
    await import(`./banks.js?t=${Date.now()}`);
  </script>
</head>

<body class="d-none" data-required-role="donor">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="d-flex align-items-center gap-2 mb-4 px-1">
        <span class="avatar-initials avatar-initials-lg" style="background-color: #b90538">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 21s-7-4.35-9.5-8.5C.5 9 2 5 5.5 5 7.5 5 9 6.5 12 9c3-2.5 4.5-4 6.5-4C22 5 23.5 9 21.5 12.5 19 16.65 12 21 12 21Z" />
          </svg>
        </span>
        <div>
          <div class="sidebar-brand-name">Pulso Solidario</div>
          <div class="sidebar-brand-sub">Panel del donante</div>
        </div>
      </div>

      <nav class="nav flex-column gap-1" aria-label="Navegación principal">
        <a class="nav-link" href="/dashboard/donor/">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          Panel
        </a>
        <a class="nav-link" href="/dashboard/donor/appointments/">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
          Citas
        </a>
        <a class="nav-link active" href="/dashboard/donor/banks/" aria-current="page">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6" />
          </svg>
          Bancos de sangre
        </a>
        <a class="nav-link mt-2" href="/dashboard/donor/profile/">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Perfil
        </a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <span class="topbar-title">Hola, <span id="dashboard-greeting-name">…</span></span>
        <div class="d-flex align-items-center gap-3">
          <button class="icon-btn" type="button" disabled
            aria-label="Notificaciones (próximamente)" title="Notificaciones — Próximamente">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
          </button>
          <div class="dropdown">
            <button type="button" id="dashboard-user-initials"
              class="avatar-initials avatar-initials-lg border-0 user-menu-toggle"
              style="background-color: #00685f" aria-expanded="false"
              aria-label="Menú de usuario">…</button>
            <div class="dropdown-menu dropdown-menu-end user-menu shadow border-0 p-0"
              aria-labelledby="dashboard-user-initials">
              <div class="user-menu__header">
                <div id="dashboard-user-name" class="fw-semibold text-truncate">…</div>
                <div id="dashboard-user-role" class="text-muted" style="font-size: 0.75rem">…</div>
              </div>
              <div class="dropdown-divider m-0"></div>
              <button type="button" id="dashboard-logout" class="dropdown-item user-menu__logout">
                Cerrar sesión
              </button>
            </div>
          </div>
        </div>
      </header>

      <main class="flex-grow-1" style="padding: 2rem 2.5rem">
        <div class="mb-4">
          <h1 class="headline fw-bold mb-1" style="font-size: 2rem">Bancos de sangre</h1>
          <p class="text-muted mb-0">Centros activos cargados desde la API.</p>
        </div>

        <div id="banks-status" class="alert alert-info mb-4" role="status" aria-live="polite">Cargando centros…</div>

        <div class="row g-4 mb-4">
          <div class="col-lg-4">
            <section class="card h-100 p-3" aria-labelledby="banks-nearby">
              <h2 class="section-title mb-3" id="banks-nearby">Destacados</h2>
              <div id="banks-nearby-list" class="d-flex flex-column gap-2"></div>
              <a href="/dashboard/donor/appointments/" class="btn btn-primary rounded-3 fw-semibold w-100 mt-3">
                Ir a mis citas
              </a>
            </section>
          </div>
          <div class="col-lg-8">
            <section class="card p-3 h-100" aria-labelledby="banks-table">
              <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                <h2 class="section-title mb-0" id="banks-table">Todos los bancos</h2>
                <span class="demo-badge" id="banks-count">—</span>
              </div>
              <div class="table-responsive">
                <table class="table table-borderless align-middle mb-0" id="donor-banks-table">
                  <thead>
                    <tr>
                      <th scope="col">Banco</th>
                      <th scope="col">Dirección</th>
                      <th scope="col">Región</th>
                      <th scope="col">Contacto</th>
                      <th scope="col" class="text-end">Acción</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>

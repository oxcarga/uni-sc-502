<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-label="Mapa de calles con centros de donación cercanos" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9ecf2"/>
      <stop offset="100%" stop-color="#dfe4ee"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#land)"/>
  <!-- parks / blocks -->
  <rect x="40" y="40" width="120" height="90" rx="8" fill="#d6e8d8"/>
  <rect x="360" y="220" width="150" height="110" rx="8" fill="#d6e8d8"/>
  <rect x="220" y="60" width="110" height="70" rx="6" fill="#e3e7f0"/>
  <!-- water -->
  <path d="M0 300 C120 280 200 330 320 320 C440 310 520 350 600 330 L600 360 L0 360 Z" fill="#cfe0f3"/>
  <!-- streets -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round">
    <line x1="0" y1="160" x2="600" y2="150"/>
    <line x1="0" y1="250" x2="600" y2="245"/>
    <line x1="120" y1="0" x2="130" y2="360"/>
    <line x1="300" y1="0" x2="305" y2="360"/>
    <line x1="470" y1="0" x2="475" y2="360"/>
  </g>
  <g stroke="#f4f6fa" stroke-width="4">
    <line x1="0" y1="90" x2="600" y2="85"/>
    <line x1="0" y1="310" x2="600" y2="305"/>
    <line x1="210" y1="0" x2="215" y2="360"/>
    <line x1="385" y1="0" x2="390" y2="360"/>
  </g>
  <!-- highlighted route -->
  <path d="M150 290 L210 250 L260 250 L305 160 L420 150" fill="none" stroke="#00685f" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.9"/>
</svg>

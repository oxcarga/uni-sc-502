server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Desarrollo local: no cachear el frontend.
    # Importante: /register/ y /login/ sirven index.html vía try_files (sin .html
    # en la URL), por eso el header va también en `location /`, no solo en *.html.
    # Así no hace falta cache-busting manual (?v=1, ?v=2, …).
    etag off;
    if_modified_since off;

    location ~* \.(js|mjs|css|html|map)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 302 /login/;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ =404;
    }
}

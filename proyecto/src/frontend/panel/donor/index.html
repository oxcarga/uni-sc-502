<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulso Solidario — Panel donante</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      crossorigin="anonymous"
    />
    <script type="module">
      import(`/js/auth-guard.js?t=${Date.now()}`);
    </script>
  </head>
  <body class="bg-light d-none" data-required-role="donor">
    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
        <div>
          <h1 class="h3">Panel donante</h1>
          <p class="text-secondary mb-0">
            Sesión:
            <span id="panel-user-name" class="fw-semibold text-dark">…</span>
          </p>
        </div>
        <button type="button" id="panel-logout" class="btn btn-outline-secondary btn-sm">
          Cerrar sesión
        </button>
      </div>
      <p class="text-secondary mb-0">Placeholder — el panel completo se implementará en fases posteriores.</p>
    </main>
  </body>
</html>

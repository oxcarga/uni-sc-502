<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulso Solidario — Confirmar correo</title>
    <meta name="description" content="Confirmación de correo de Pulso Solidario." />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/custom.css" />
    <script type="module">
      import(`./confirm-email.js?t=${Date.now()}`);
    </script>
  </head>
  <body>
    <section class="p-3 p-md-4 p-xl-5 min-vh-100" style="background-color: #eff4ff">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4" style="background-color: #dce8e7">
              <div class="card-body p-4 p-xl-5">
                <h1 class="h3 mb-3">Confirmación de correo</h1>
                <p id="confirm-status" class="text-secondary mb-0">Validando tu enlace…</p>
                <div
                  id="confirm-error"
                  class="alert alert-danger d-none mt-3"
                  role="alert"
                  aria-live="polite"
                ></div>
                <p class="mt-4 mb-0">
                  <a href="/login/" class="link-primary text-decoration-none">Ir a iniciar sesión</a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>

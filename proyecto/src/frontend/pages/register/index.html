<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulso Solidario — Registro</title>
    <meta
      name="description"
      content="Regístrate en Pulso Solidario, plataforma de gestión de donaciones de sangre."
    />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/custom.css" />
    <script type="module">
      // Timestamp por carga: evita módulos ES cacheados por el navegador en local.
      import(`./register.js?t=${Date.now()}`);
    </script>
  </head>
  <body>
    <section class="p-3 p-md-4 p-xl-5" style="background-color: #eff4ff">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-9 col-lg-7 col-xl-6 col-xxl-5">
            <div class="card border-0 shadow-sm rounded-4" style="background-color: #dce8e7">
              <div class="card-body p-3 p-md-4 p-xl-5">
                <div class="row">
                  <div class="col-12">
                    <div class="mb-5">
                      <h2 class="h3">Registro</h2>
                      <h3 class="fs-6 fw-normal text-secondary m-0">Ingresa tus datos para registrarte</h3>
                    </div>
                  </div>
                </div>
                <div
                  id="register-success"
                  class="alert alert-success d-none"
                  role="status"
                  aria-live="polite"
                >
                  <p class="mb-2">
                    Te enviamos un enlace de confirmación a
                    <strong id="register-success-email"></strong>.
                  </p>
                  <p class="mb-3">
                    Confirma tu cuenta desde el correo antes de iniciar sesión.
                  </p>
                  <p id="register-mailhog-tip" class="mb-3 d-none">
                    En local puedes ver el mensaje en Mailhog
                    (<a href="http://localhost:8025" target="_blank" rel="noopener noreferrer">http://localhost:8025</a>).
                  </p>
                  <p id="register-resend-status" class="small text-secondary d-none mb-3" role="status"></p>
                  <div class="d-flex flex-wrap gap-2">
                    <button
                      type="button"
                      id="register-resend"
                      class="btn btn-outline-success btn-sm"
                    >
                      Reenviar correo
                    </button>
                    <a href="/login/" class="btn btn-link btn-sm">Ir a iniciar sesión</a>
                  </div>
                </div>
                <form id="register-form">
                  <div
                    id="register-error"
                    class="alert alert-danger d-none"
                    role="alert"
                    aria-live="polite"
                  ></div>
                  <div class="row gy-3 overflow-hidden">
                    <div class="col-12">
                      <div class="form-floating mb-3">
                        <input
                          type="text"
                          class="form-control"
                          name="firstName"
                          id="firstName"
                          placeholder="Nombre"
                          required
                        />
                        <label for="firstName" class="form-label">Nombre</label>
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="form-floating mb-3">
                        <input
                          type="text"
                          class="form-control"
                          name="lastName"
                          id="lastName"
                          placeholder="Apellido"
                          required
                        />
                        <label for="lastName" class="form-label">Apellido</label>
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="form-floating mb-3">
                        <input
                          type="email"
                          class="form-control"
                          name="email"
                          id="email"
                          placeholder="nombre@ejemplo.com"
                          required
                        />
                        <label for="email" class="form-label">Correo electrónico</label>
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="form-floating mb-3">
                        <input
                          type="password"
                          class="form-control"
                          name="password"
                          id="password"
                          placeholder="Contraseña"
                          required
                        />
                        <label for="password" class="form-label">Contraseña</label>
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" name="iAgree" id="iAgree" required />
                        <label class="form-check-label text-secondary" for="iAgree">
                          Acepto los
                          <a href="#!" class="link-primary text-decoration-none">términos y condiciones</a>
                        </label>
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="d-grid">
                        <button
                          class="btn bsb-btn-2xl"
                          type="submit"
                          style="background-color: #00685f; border-color: #00685f; color: #fff"
                        >
                          Registrarse
                        </button>
                      </div>
                    </div>
                  </div>
                </form>
                <div class="row">
                  <div class="col-12">
                    <hr class="mt-5 mb-4 border-secondary-subtle" />
                    <p class="m-0 text-secondary text-center">
                      ¿Ya tienes cuenta?
                      <a href="/login/" class="link-primary text-decoration-none">Inicia sesión</a>
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>

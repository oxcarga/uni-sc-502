version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulso-solidario-backend
    ports:
      - "3001:80"
    volumes:
      - ./backend:/var/www/backend
      - ./database:/database:ro
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=${DB_USER:-pulso_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-pulso_password}
      - MYSQL_DATABASE=${DB_NAME:-pulso_solidario}
    depends_on:
      - db
      #db:
        #condition: service_healthy
    networks:
      - pulso-network
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: pulso-solidario-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:80
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    networks:
      - pulso-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: pulso-solidario-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${DB_NAME:-pulso_solidario}
      - MYSQL_USER=${DB_USER:-pulso_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-pulso_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - pulso-network
    restart: unless-stopped
    #healthcheck:
      #test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      #timeout: 20s
      #retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pulso-solidario-phpmyadmin
    environment:
      - PMA_HOST=db
      - PMA_USER=${DB_USER:-pulso_user}
      - PMA_PASSWORD=${DB_PASSWORD:-pulso_password}
    ports:
      - "3002:80"
    depends_on:
      - db
    networks:
      - pulso-network
    restart: unless-stopped

volumes:
  mysql_data:
  frontend_node_modules:

networks:
  pulso-network:
    driver: bridge

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulso-solidario-backend
    ports:
      - "3001:80"
    volumes:
      - ./backend:/var/www/backend
      - ./database:/database:ro
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=${DB_USER:-pulso_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-pulso_password}
      - MYSQL_DATABASE=${DB_NAME:-pulso_solidario}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - MAIL_FROM=${MAIL_FROM:-noreply@pulso-solidario.local}
    depends_on:
      - db
      - mailhog
    networks:
      - pulso-network
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: pulso-solidario-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pulso-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: pulso-solidario-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${DB_NAME:-pulso_solidario}
      - MYSQL_USER=${DB_USER:-pulso_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-pulso_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - pulso-network
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pulso-solidario-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - pulso-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pulso-solidario-phpmyadmin
    environment:
      - PMA_HOST=db
      - PMA_USER=${DB_USER:-pulso_user}
      - PMA_PASSWORD=${DB_PASSWORD:-pulso_password}
    ports:
      - "3002:80"
    depends_on:
      - db
    networks:
      - pulso-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  pulso-network:
    driver: bridge

<!DOCTYPE html>
<html>

<body>
    <h1>Solicitud Asíncrona con Fetch API y Promesas</h1>
    <button id="cargarDatos">Cargar Datos</button>
    <div id="resultado"></div>
    <img id="dogImage" src="" alt="Imagen" style="display: none;">

    <script>
        // document.getElementById("resultado").innerHTML = "HOLA !!!"
        document
            .getElementById("cargarDatos")
            .addEventListener("click", function () {
                // fetch("https://jsonplaceholder.typicode.com/posts/1")
                fetch("https://dog.ceo/api/breeds/image/randommmmm")
                    .then((response) => response.json())
                    .then(
                        function (data) {
                            debugger;
                            const imgTag = document.getElementById("dogImage");
                            // document.getElementById("resultado").innerHTML = JSON.stringify(data, null, 4)
                            imgTag.style.display = "block";
                            imgTag.src = data.message;
                        }
                    )
                    .catch(function (error) {
                        document.getElementById("resultado").innerHTML = "Error: " + err;
                    });
            });
    </script>
</body>

</html>

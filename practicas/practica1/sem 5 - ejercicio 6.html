<!DOCTYPE html>
<html>

<body>
    <h1>Bucle For en JavaScript</h1>
    <p id="bucle"></p>

    <script>
        var texto = "";
        for (var i = 0; i < 5; i++) {
            texto += "El número es " + i + "<br>";
        }
        document.getElementById("bucle").innerHTML = texto;
    </script>
</body>

</html>

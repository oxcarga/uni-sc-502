server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;

    # Desarrollo local: no cachear el frontend.
    # Vistas en frontend/pages/*; URLs públicas sin prefijo /pages.
    # Assets compartidos: /css, /js, /images en la raíz del frontend.
    etag off;
    if_modified_since off;

    location /api/ {
        proxy_pass http://backend:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location = / {
        return 302 /login/;
    }

    # No exponer /pages como URL pública
    location ^~ /pages/ {
        return 404;
    }

    # Vistas: root interno = pages/, URL pública sin /pages
    location ^~ /login {
        root /usr/share/nginx/html/pages;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location ^~ /register {
        root /usr/share/nginx/html/pages;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location ^~ /confirm-email {
        root /usr/share/nginx/html/pages;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location ^~ /dashboard {
        root /usr/share/nginx/html/pages;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|mjs|css|html|map)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ =404;
    }
}

<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f0f0f0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            form {
                background-color: #fff;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.1);
                min-width: 280px;
            }
            label {
                display: block;
                margin-bottom: 10px;
            }
            input {
                display: block;
                margin-bottom: 10px;
                width: 100%;
                box-sizing: border-box;
            }
            input[type="submit"] {
                background-color: #007bff;
                color: #fff;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
            }
            input[type="submit"]:hover {
                background-color: #0056b3;
            }
            .mensaje {
                margin-bottom: 12px;
                padding: 8px 10px;
                border-radius: 5px;
                font-size: 0.9rem;
            }
            .mensaje-error {
                background-color: #fdecea;
                color: #b71c1c;
            }
            .mensaje-ok {
                background-color: #e8f5e9;
                color: #1b5e20;
            }
        </style>
    </head>
    <body>
        <form action="login.php" method="post">
            <div id="mensaje" class="mensaje" hidden></div>
            <label for="email">Email:</label>
            <input type="text" name="email" id="email" placeholder="Email" required>
            <label for="password">Contraseña:</label>
            <input type="password" name="password" id="password" placeholder="Contraseña" required>
            <input type="submit" value="Iniciar sesión" id="submit">
        </form>
        <script>
            (function () {
                var params = new URLSearchParams(window.location.search);
                var error = params.get('error');
                var ok = params.get('ok');
                var box = document.getElementById('mensaje');

                if (!box) {
                    return;
                }

                if (error) {
                    box.textContent = error;
                    box.classList.add('mensaje-error');
                    box.hidden = false;
                } else if (ok) {
                    box.textContent = ok;
                    box.classList.add('mensaje-ok');
                    box.hidden = false;
                }
            })();
        </script>
    </body>
</html>
